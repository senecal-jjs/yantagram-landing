events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        
        # Disable directory listings
        autoindex off;
        
        # Handle requests
        location / {
            # Try exact file, then directory index, then fallback
            # This avoids 301 redirects for directory URLs without trailing slash
            try_files $uri $uri/index.html /index.html;
        }
        
        # Error pages
        error_page 404 /index.html;
    }
}